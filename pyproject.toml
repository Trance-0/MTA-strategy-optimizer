[project]
name = "marketing-roi-analysis"
version = "0.1.0"
description = "Validation-oriented multi-touch attribution and explainable advertising budget initialization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The attribution, standard, and strategy modules remain standard-library only.
# These dependencies belong to the database import alone; install with:
#   uv sync --extra dashboard
#
# The dashboard itself is a Vue client over a Node API and needs no Python at
# all: `./dashboard/run.sh` installs its own dependencies with npm. What is
# left here is what `script/import_to_database.py` needs to populate the
# PostgreSQL mirror from the committed artifacts.
dashboard = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
