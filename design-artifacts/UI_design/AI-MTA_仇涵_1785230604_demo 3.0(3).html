<style>

.main{margin-left:118px;min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;position:sticky;top:0;z-index:10}.topbar h1{font-size:22px;letter-spacing:-.4px;margin:0}.crumb{font-size:11px;color:var(--sub);margin-top:3px}.top-right{margin-left:auto;display:flex;gap:7px}.content{padding:22px 26px 36px;max-width:1480px;margin:auto}
.workspace{display:grid;grid-template-columns:188px 1fr;gap:14px;align-items:start}.filters{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;position:sticky;top:94px}.filters h3{font-size:13px;margin:0 0 13px}.field{margin-bottom:11px}.field:last-child{margin:0}.field label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:5px}.field select,.field input,.field textarea{width:100%;border:1px solid var(--line2);border-radius:6px;background:#fff;padding:8px 9px;outline:none}.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}.card+.card{margin-top:14px}.card-head{min-height:48px;border-bottom:1px solid var(--line);padding:12px 15px;display:flex;align-items:center;gap:9px}.card-head h2{font-size:15px;margin:0}.card-head .sub{font-size:11px;color:var(--muted)}.card-head .right{margin-left:auto;display:flex;gap:7px;align-items:center}.card-body{padding:15px}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}.two>*,.workspace>*,.optimizer-grid>*{min-width:0}

.btn{border:1px solid var(--line2);border-radius:6px;background:#fff;color:#344054;padding:8px 11px;font-weight:650}.btn:hover{background:#f7f8fa}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1e488c}.btn.small{padding:6px 9px;font-size:11px}.btn.link{border:0;background:transparent;color:var(--blue);padding:4px 0}.btn:disabled{opacity:.55;cursor:not-allowed}

.activity{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.activity:last-child{border:0}.activity div{flex:1;min-width:0}.activity strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activity span{font-size:10.5px;color:var(--muted)}
.pacing-title{display:flex;align-items:center;justify-content:space-between;margin:15px 0 8px;padding-top:14px;border-top:1px solid var(--line)}.pacing-title h3{font-size:12px;margin:0}.pacing-title span{font-size:10px;color:var(--muted)}.pacing-item{display:grid;grid-template-columns:minmax(120px,1.3fr) 70px minmax(90px,1fr) 44px;gap:10px;align-items:center;padding:7px 0}.pacing-item>span{font-size:10.5px;color:var(--muted)}.pacing-item .progress{margin:0}

.table-wrap{overflow-x:auto}table{width:100%;min-width:720px;border-collapse:collapse}th{background:#fafbfc;color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.35px;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line)}td{padding:10px 11px;border-bottom:1px solid var(--line)}tbody tr:last-child td{border:0}tbody tr:hover{background:#fafbfd}.num{text-align:right}.name strong{display:block;font-size:12px}.name span{display:block;font-size:10px;color:var(--sub);margin-top:2px}.up{color:var(--green);font-weight:750}.down{color:var(--red);font-weight:750}
.group{border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:10px}.group:last-child{margin:0}.group-main,.ad-row{display:grid;grid-template-columns:minmax(180px,1.5fr) repeat(4,minmax(80px,.7fr)) 100px;gap:8px;align-items:center;padding:11px 13px}.group-main:hover{background:#fafbfd}.group-main label,.ad-row label{display:block;font-size:9px;color:var(--sub);margin-bottom:3px}.group-main .v,.ad-row .v{font-size:12px;font-weight:700}.ad-list{border-top:1px solid var(--line);background:#fbfcfd;padding:0 13px}.ad-row{padding:9px 0;border-bottom:1px solid var(--line)}.ad-row:last-child{border:0}
.optimizer-bar{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:13px;display:flex;align-items:center;gap:9px}.optimizer-bar strong{font-size:13px}.optimizer-bar span{display:block;color:var(--muted);font-size:10.5px}.optimizer-bar .actions{margin-left:auto;display:flex;gap:7px}.optimizer-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(250px,1fr);gap:14px;align-items:start}.recommendation{border-color:#b9c9e4}.rec-summary{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#f7f9fc;border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin-bottom:12px}.rec-summary span{color:var(--muted);font-size:11px}.rec-summary b{font-size:12px}
.review-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.review-head strong{font-size:17px}.review-rule{padding:10px 0;border-block:1px solid var(--line)}.review-rule label{display:block;font-size:9.5px;text-transform:uppercase;color:var(--muted);font-weight:750;margin-bottom:4px}.review-rule p{font-size:11px;line-height:1.45;color:var(--muted);margin:5px 0 0}.feedback-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.feedback-note{display:none;margin-top:8px}.feedback-note.show{display:block}.feedback-confirm{background:var(--green2);color:var(--green);border-radius:6px;padding:9px 10px;font-size:11px;font-weight:700;margin-top:10px}
.pilot{display:none;margin-top:14px}.pilot.show{display:block}.pilot-form{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.pilot-form .field{margin:0}.pilot-result{display:none;grid-template-columns:1fr 1fr;gap:9px;border-top:1px solid var(--line);padding-top:13px;margin-top:13px}.pilot-result.show{display:grid}.compare{border:1px solid var(--line);border-radius:7px;padding:11px}.compare span{font-size:10px;color:var(--muted)}.compare b{display:block;font-size:17px;margin:4px 0}
.log-metrics{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin:-15px -15px 13px}.log-metrics div{padding:12px 15px;border-right:1px solid var(--line)}.log-metrics div:last-child{border:0}.log-metrics b{display:block;font-size:17px}.log-metrics span{font-size:10px;color:var(--muted)}
.health-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}.health{border:1px solid var(--line);border-radius:7px;padding:11px}.health b{display:block;font-size:19px}.health span{font-size:10px;color:var(--muted)}.attention-list{display:grid;gap:8px}.attention{display:grid;grid-template-columns:minmax(160px,1.4fr) 90px minmax(150px,1.2fr) 120px 85px;gap:9px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:10px}.attention span{font-size:10.5px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:32px}
.toast{position:fixed;right:22px;bottom:22px;background:#17233c;color:#fff;border-radius:7px;padding:11px 14px;font-weight:650;opacity:0;transform:translateY(80px);transition:.18s;z-index:50}.toast.show{opacity:1;transform:none}
@media(max-width:1050px){.two,.optimizer-grid{grid-template-columns:1fr}.pilot-form{grid-template-columns:repeat(2,1fr)}.group-main,.ad-row{grid-template-columns:minmax(160px,1.5fr) repeat(2,minmax(80px,.7fr)) 100px}.group-main>*:nth-child(4),.group-main>*:nth-child(5),.ad-row>*:nth-child(4),.ad-row>*:nth-child(5){display:none}}

@media(max-width:480px){.optimizer-bar{flex-wrap:wrap}.optimizer-bar .actions{margin-left:0;width:100%}.optimizer-bar .actions .btn{flex:1}.rec-actions{flex-wrap:wrap}.rec-actions .btn{flex:1;min-width:130px}.group-main{grid-template-columns:minmax(0,1fr) auto}.group-main>*:not(:first-child):not(button){display:none!important}.ad-row{grid-template-columns:minmax(0,1fr) 72px}.ad-row>*:nth-child(n+3){display:none!important}}

<body>

<main class="main">
  <header class="topbar"><div><h1 id="pageTitle">Command Center</h1><div class="crumb" id="pageCrumb">BrandLens / Overview</div></div><div class="top-right"><span class="tag blue">FY25–26</span><span class="tag gray">Amazon · US</span></div></header>
  <div class="content" id="content"></div>
</main>
<div class="toast" id="toast">Done</div>
<script>
const campaigns=[
 {id:"shave-us",name:"Shave Care — US",budget:500,spend:374,forecast:492,roas:4.18,recRoas:4.83,controlRoas:4.31,status:"Needs optimization",review:{outcome:"CONFLICT",rule:"Protected Discovery Minimum",message:"Two ad groups fall below the required learning budget.",risk:"High"},groups:[["Brand Defense",120,155,6.1],["Generic Search",180,150,3.2],["Retargeting",90,100,4.5],["Discovery",110,95,2.6]],adopted:false,pilot:null,feedback:null},
 {id:"stv-launch",name:"Streaming TV — Spring",budget:360,spend:249,forecast:352,roas:3.90,recRoas:4.32,controlRoas:3.90,status:"Opportunity",review:{outcome:"MATCH",rule:"Upper-funnel Investment Cap",message:"The proposed pilot stays within the approved 25% launch cap.",risk:"Low"},groups:[["Texas Pilot",70,95,4.6],["Southeast Control",90,80,3.7],["National Awareness",140,130,3.9],["Retargeting",60,55,4.1]],adopted:true,pilot:{state:"Texas",controls:"Oklahoma + Louisiana",duration:"4 weeks",metric:"ROAS",share:"15%",ran:true},feedback:null},
 {id:"dsp-prospecting",name:"DSP Prospecting — US",budget:420,spend:238,forecast:361,roas:2.10,recRoas:2.56,controlRoas:2.23,status:"Review",review:{outcome:"NO_COVERAGE",rule:"No applicable prospecting rule",message:"Third-party prospecting audiences are not covered by an approved rule.",risk:"Medium"},groups:[["In-market Audiences",150,130,2.4],["Lifestyle Audiences",105,95,2.0],["Contextual",85,110,2.8],["Lookalike",80,85,2.3]],adopted:false,pilot:null,feedback:null}
];
const meta={overview:["Command Center","BrandLens / Overview"],budget:["Budget Manager","BrandLens / Planning / Budget"],campaigns:["Campaigns","BrandLens / Planning / Campaigns"],optimizer:["Campaign Optimizer","BrandLens / Planning / Optimizer"],log:["Optimization Log","BrandLens / Insights / Results"],knowledge:["Knowledge Base","BrandLens / Insights / Governance"]};
let currentCampaignId=null,optimizerReady=false,noteOpen=false,toastTimer,currentPage="overview",runToken=0;
const money=n=>(n<0?"−$":"$")+Math.abs(n)+"K",pct=(a,b)=>Math.round(a/b*100)+"%",selected=()=>campaigns.find(c=>c.id===currentCampaignId)||null;
const tag=(t,c="gray")=>`<span class="tag ${c}">${t}</span>`;
function tone(s){if(["MATCH","Verified","On track"].includes(s))return"green";if(["CONFLICT","At risk","Needs optimization"].includes(s))return"red";if(["NO_COVERAGE","Review","Opportunity","Underspending"].includes(s))return"amber";return"gray"}
function filters(){return `<aside class="filters"><h3>Filters</h3>${[["Fiscal Year","FY25–26"],["Retailer","Amazon"],["Market","US"],["Category","Shave Care"]].map(x=>`<div class="field"><label>${x[0]}</label><select><option>${x[1]}</option><option>All</option></select></div>`).join("")}</aside>`}
function pageOverview(){return `<div class="two">
 <section class="card"><div class="card-head"><h2>Optimizer impact</h2><div class="right">${tag("Last 90 days","blue")}</div></div><div class="card-body"><div class="result"><div><small>Before</small><b>4.18x</b></div><div class="arrow">→</div><div class="after"><small>After</small><b>4.83x</b></div></div><div class="impact"><div><b>+15.6%</b><span>ROAS lift</span></div><div><b>+$1.9M</b><span>Incremental revenue</span></div><div><b>12</b><span>Campaigns optimized</span></div></div></div></section>
 <section class="card"><div class="card-head"><h2>Recent results</h2><div class="right"><button class="btn link small" onclick="go('log')">View log</button></div></div><div class="card-body">${[["Streaming TV — Texas pilot","ROAS +10.8%","Verified"],["Shave Care — US","$65K reallocated","Review"],["DSP Prospecting — US","Coverage requested","NO_COVERAGE"]].map(x=>`<div class="activity"><div><strong>${x[0]}</strong><span>${x[1]}</span></div>${tag(x[2],tone(x[2]))}</div>`).join("")}</div></section>
 </div>`}
function budgetState(c){if(c.forecast>c.budget*1.03)return["At risk","red"];if(c.spend/c.budget<.62)return["Underspending","amber"];return["On track","green"]}
function pageBudget(){const b=campaigns.reduce((s,c)=>s+c.budget,0),sp=campaigns.reduce((s,c)=>s+c.spend,0),f=campaigns.reduce((s,c)=>s+c.forecast,0);return `<div class="workspace">${filters()}<div>
 <section class="card"><div class="card-head"><h2>Budget utilization</h2><div class="right"><select class="btn"><option>FY25–26</option><option>Q2</option><option>April</option></select></div></div><div class="card-body"><div class="metrics"><div class="metric"><label>Approved budget</label><b>$${(b/1000).toFixed(2)}M</b></div><div class="metric"><label>Actual spend</label><b>$${(sp/1000).toFixed(2)}M</b><span>${pct(sp,b)} utilized</span></div><div class="metric"><label>Remaining</label><b>$${((b-sp)/1000).toFixed(2)}M</b></div><div class="metric"><label>Forecast</label><b>$${(f/1000).toFixed(2)}M</b><span>End of period</span></div></div><div class="progress-row"><div class="progress"><i style="width:${pct(sp,b)}"></i></div><b>${pct(sp,b)}</b></div></div></section>
 <section class="card"><div class="card-head"><h2>Spend by campaign</h2><div class="sub">Exceptions open in Optimizer</div></div><div class="card-body"><div class="table-wrap"><table><thead><tr><th>Campaign</th><th class="num">Budget</th><th class="num">Spend</th><th class="num">Pacing</th><th class="num">Forecast</th><th>Status</th><th></th></tr></thead><tbody>${campaigns.map(c=>{const s=budgetState(c);return `<tr><td class="name"><strong>${c.name}</strong><span>${c.groups.length} ad groups</span></td><td class="num">${money(c.budget)}</td><td class="num">${money(c.spend)}</td><td class="num">${pct(c.spend,c.budget)}</td><td class="num">${money(c.forecast)}</td><td>${tag(s[0],s[1])}</td><td><button class="btn link small" onclick="openOptimizer('${c.id}')">Review</button></td></tr>`}).join("")}</tbody></table></div><div class="pacing-title"><h3>Ad-group pacing · Shave Care — US</h3><span>Current period</span></div>${campaigns[0].groups.map((g,i)=>{const spends=[105,136,71,62],p=Math.round(spends[i]/g[1]*100);return `<div class="pacing-item"><b>${g[0]}</b><span>${money(spends[i])} / ${money(g[1])}</span><div class="progress"><i style="width:${Math.min(p,100)}%"></i></div><strong>${p}%</strong></div>`}).join("")}</div></section>
 </div></div>`}
function pageCampaigns(){return `<div class="workspace">${filters()}<section class="card"><div class="card-head"><h2>Campaign groups</h2><div class="right"><select class="btn"><option>All statuses</option><option>Needs optimization</option></select></div></div><div class="card-body">${campaigns.map(c=>`<div class="group"><div class="group-main"><div class="name"><strong>${c.name}</strong><span>US · Amazon</span></div><div><label>Budget</label><span class="v">${money(c.budget)}</span></div><div><label>Spend</label><span class="v">${money(c.spend)}</span></div><div><label>ROAS</label><span class="v">${c.roas.toFixed(2)}x</span></div><div><label>Status</label>${tag(c.status,tone(c.status))}</div><button class="btn primary small" onclick="openOptimizer('${c.id}')">Optimize</button></div><div class="ad-list">${c.groups.map(g=>`<div class="ad-row"><div class="name"><strong>${g[0]}</strong><span>Ad group</span></div><div><label>Budget</label><span class="v">${money(g[1])}</span></div><div><label>ROAS</label><span class="v">${g[3].toFixed(1)}x</span></div><div><label>Status</label>${tag(budgetState(c)[0],budgetState(c)[1])}</div><div></div><div></div></div>`).join("")}</div></div>`).join("")}</div></section></div>`}
const portfolioScenario={id:"portfolio",name:"Portfolio example",budget:500,roas:4.18,recRoas:4.83,controlRoas:4.31,adopted:false,feedback:null,pilot:null,review:{outcome:"MATCH",rule:"Fixed-budget Reallocation",message:"The recommendation preserves total approved spend.",risk:"Low"},groups:[["Brand Search",150,175,5.8],["Generic Search",140,120,3.1],["Retargeting",100,115,4.4],["Prospecting",110,90,2.3]]};
function portfolio(){return portfolioScenario}function active(){return selected()||portfolio()}function safeReview(r){return r&&["MATCH","CONFLICT","NO_COVERAGE"].includes(r.outcome)?r:{outcome:"NO_COVERAGE",rule:r?.rule||"No applicable rule",message:r?.message||"No approved rule covers this recommendation.",risk:r?.risk||"Medium"}}function reviewTone(r){return r==="MATCH"?"green":r==="CONFLICT"?"red":"amber"}function feedbackChoices(r){r=safeReview({outcome:r}).outcome;return r==="MATCH"?["Looks right","Flag an issue"]:r==="CONFLICT"?["Accept adjustment","Challenge rule"]:["Request coverage","Not applicable"]}function feedbackSummary(f){return `Feedback recorded: ${f.action}${f.note?" · Evidence saved":""}`}
function pageOptimizer(){const c=active();return `<div class="optimizer-bar"><div><strong>${c.name}</strong><span>${c.id==="portfolio"?"Portfolio view":"Campaign"} · Fixed budget ${money(c.budget)}</span></div><div class="actions">${currentCampaignId?`<button class="btn small" onclick="clearCampaign()">Portfolio</button>`:""}<button class="btn primary" id="runBtn" onclick="runOptimizer()">${optimizerReady||c.adopted?"Run again":"Run Optimizer"}</button></div></div>${optimizerReady||c.adopted?optimizerResult(c):`<section class="card"><div class="empty">Run Optimizer to compare current and recommended ad-group allocation.</div></section>`}`}
function optimizerResult(c){const cur=c.groups.reduce((s,g)=>s+g[1],0),rec=c.groups.reduce((s,g)=>s+g[2],0),review=safeReview(c.review),choices=feedbackChoices(review.outcome),fb=c.feedback;return `<div class="optimizer-grid">
 <section class="card recommendation"><div class="card-head"><h2>Recommended allocation</h2><div class="right">${tag("Total preserved","blue")}</div></div><div class="card-body"><div class="rec-summary"><div><b>Reallocate budget across ${c.groups.length} ad groups</b><br><span>Expected blended ROAS: ${c.roas.toFixed(2)}x → ${c.recRoas.toFixed(2)}x</span></div><b>${money(cur)} → ${money(rec)}</b></div><div class="table-wrap"><table><thead><tr><th>Ad group</th><th class="num">Current</th><th class="num">Recommended</th><th class="num">Change</th><th class="num">Expected ROAS</th></tr></thead><tbody>${c.groups.map(g=>{const d=g[2]-g[1];return `<tr><td class="name"><strong>${g[0]}</strong></td><td class="num">${money(g[1])}</td><td class="num"><b>${money(g[2])}</b></td><td class="num ${d>=0?"up":"down"}">${d>=0?"+":""}${money(d)}</td><td class="num">${g[3].toFixed(1)}x</td></tr>`}).join("")}</tbody><tfoot><tr><td><b>Total</b></td><td class="num"><b>${money(cur)}</b></td><td class="num"><b>${money(rec)}</b></td><td></td><td></td></tr></tfoot></table></div><div class="rec-actions" style="display:flex;gap:8px;margin-top:13px">${c.id==="portfolio"?`<button class="btn primary" onclick="go('campaigns')">Choose campaign to adopt</button>`:`<button class="btn primary" onclick="adopt()">Adopt recommendation</button>`}<button class="btn" onclick="toast('Allocation editing is simulated')">Adjust allocation</button></div></div></section>
 <aside class="card"><div class="card-head"><h2>Ontology review</h2></div><div class="card-body"><div class="review-head"><strong>${review.outcome.replace("_"," ")}</strong>${tag(review.risk+" risk",reviewTone(review.outcome))}</div><div class="review-rule"><label>${review.outcome==="CONFLICT"?"Violated rule":review.outcome==="NO_COVERAGE"?"Coverage gap":"Matched rule"}</label><b>${review.rule}</b><p>${review.message}</p></div>${fb?`<div class="feedback-confirm">${feedbackSummary(fb)}</div>`:`<div id="feedbackArea"><div class="feedback-actions">${choices.map(x=>`<button class="btn small" onclick="submitFeedback('${x}')">${x}</button>`).join("")}</div><button class="btn link small" onclick="toggleNote()">Add evidence or comment</button><div class="feedback-note ${noteOpen?"show":""}" id="feedbackNote"><textarea id="feedbackText" rows="3" placeholder="Optional note"></textarea></div></div>`}</div></aside>
 </div>${pilotCard(c)}`}
function pilotCard(c){if(c.id==="portfolio"||!c.adopted)return`<section class="card pilot"></section>`;const p=c.pilot||{},duration=p.duration||"4 weeks",metric=p.metric||"ROAS",share=p.share||"10%",lift=((c.recRoas/c.controlRoas-1)*100).toFixed(1),pilotValue=metric==="ROAS"?`${c.recRoas.toFixed(2)}x ROAS`:`$${Math.round(100/c.recRoas)} CPA`,controlValue=metric==="ROAS"?`${c.controlRoas.toFixed(2)}x ROAS`:`$${Math.round(100/c.controlRoas)} CPA`;return `<section class="card pilot show"><div class="card-head"><h2>Regional pilot</h2><div class="sub">Pilot state vs control states</div><div class="right">${tag(p.ran?"Completed":"Ready",p.ran?"green":"blue")}</div></div><div class="card-body"><div class="pilot-form">${[["Pilot state","pilotState",["Texas","California","Florida"],p.state||"Texas"],["Control states","pilotControls",["Oklahoma + Louisiana","Nevada + Arizona","Georgia + Alabama"],p.controls||"Oklahoma + Louisiana"],["Duration","pilotDuration",["4 weeks","6 weeks"],duration],["Success metric","pilotMetric",["ROAS","CPA"],metric],["Variant budget","pilotShare",["10%","15%","20%"],share]].map(f=>`<div class="field"><label>${f[0]}</label><select id="${f[1]}">${f[2].map(o=>`<option ${o===f[3]?"selected":""}>${o}</option>`).join("")}</select></div>`).join("")}</div><button class="btn primary" style="margin-top:12px" onclick="startPilot()">${p.ran?"Run again":"Start pilot"}</button><div class="pilot-result ${p.ran?"show":""}"><div class="compare"><span>Pilot · ${p.state||"Texas"}</span><b>${pilotValue}</b><span>${duration} · ${share} budget · ${metric==="ROAS"?`+${lift}%`:`Improved`} vs control</span></div><div class="compare"><span>Control · ${p.controls||"Oklahoma + Louisiana"}</span><b>${controlValue}</b><span>Baseline</span></div></div></div></section>`}
function pageLog(){const rows=[["Jul 20","Streaming TV — Spring","Texas +15%","MATCH","Texas","ROAS +10.8%","Verified"],["Jul 18","Shave Care — US","$65K reallocated","CONFLICT","—","Pending","Review"],["Jul 14","DSP Prospecting — US","Coverage requested","NO_COVERAGE","—","—","Open"]];return `<section class="card"><div class="card-head"><h2>Optimization records</h2><div class="right"><button class="btn small" onclick="toast('Export prepared')">Export</button></div></div><div class="card-body"><div class="log-metrics"><div><b>12</b><span>Optimized campaigns</span></div><div><b>9</b><span>Verified wins</span></div><div><b>+$4.8M</b><span>Incremental revenue</span></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Campaign</th><th>Change</th><th>Review</th><th>Pilot</th><th>Result</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="name"><strong>${r[1]}</strong></td><td>${r[2]}</td><td>${tag(r[3],tone(r[3]))}</td><td>${r[4]}</td><td>${r[5]}</td><td>${tag(r[6],tone(r[6]))}</td></tr>`).join("")}</tbody></table></div></div></section>`}
function pageKnowledge(){const assets=[["DSP Prospecting","Rule","Coverage gap","Programmatic COE","Needs review","red"],["Discovery Minimum","Rule","3 user challenges","Search COE","Review","amber"],["Regional Pilot","Concept","Missing definition","Unassigned","Draft","gray"]];return `<section class="card"><div class="card-head"><h2>Concepts & rules requiring attention</h2><div class="right">${tag("Simulated data","gray")}</div></div><div class="card-body"><div class="attention-list">${assets.map(a=>`<div class="attention"><b>${a[0]}</b><span>${a[1]}</span><span>${a[2]}</span><span>${a[3]}</span>${tag(a[4],a[5])}</div>`).join("")}</div></div></section><section class="card"><div class="card-head"><h2>Ontology health</h2><div class="sub">Computed demo snapshot</div></div><div class="card-body"><div class="health-grid">${[["93%","Rule coverage"],["3","Rule conflicts"],["6","Expiring assets"],["4","Golden Test failures"]].map(x=>`<div class="health"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div><div class="attention-list">${[["Prospecting coverage","7 uncovered reviews","Programmatic COE","High","red"],["Scale thresholds","2 overlapping rules","Media Strategy","Medium","amber"],["Frequency policy","Expires in 12 days","Governance","Medium","amber"]].map(a=>`<div class="attention"><b>${a[0]}</b><span>Issue</span><span>${a[1]}</span><span>${a[2]}</span>${tag(a[3],a[4])}</div>`).join("")}</div></div></section>`}
const pages={overview:pageOverview,budget:pageBudget,campaigns:pageCampaigns,optimizer:pageOptimizer,log:pageLog,knowledge:pageKnowledge};
function go(p){currentPage=p;document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.page===p));document.getElementById("pageTitle").textContent=meta[p][0];document.getElementById("pageCrumb").textContent=meta[p][1];document.getElementById("content").innerHTML=pages[p]();window.scrollTo(0,0)}
function openOptimizer(id){runToken++;currentCampaignId=id;optimizerReady=false;noteOpen=false;go("optimizer")}function clearCampaign(){runToken++;currentCampaignId=null;optimizerReady=false;noteOpen=false;go("optimizer")}
function runOptimizer(){const b=document.getElementById("runBtn"),token=++runToken,id=currentCampaignId;if(b){b.disabled=true;b.textContent="Analyzing…"}setTimeout(()=>{if(token!==runToken||id!==currentCampaignId)return;optimizerReady=true;if(currentPage==="optimizer")go("optimizer");toast("Recommendation ready")},450)}
function adopt(){const c=selected();if(!c){toast("Choose a campaign before adoption");return}c.adopted=true;optimizerReady=true;go("optimizer");toast("Recommendation adopted")}
function toggleNote(){noteOpen=!noteOpen;document.getElementById("feedbackNote")?.classList.toggle("show",noteOpen)}
function submitFeedback(action){const c=active(),note=document.getElementById("feedbackText")?.value.trim()||"";c.feedback={action,note};go("optimizer");toast("Feedback recorded for ontology review")}
function startPilot(){const c=selected();if(!c){toast("Select a campaign before starting a regional pilot");return}const state=document.getElementById("pilotState").value,controls=document.getElementById("pilotControls").value,duration=document.getElementById("pilotDuration").value,metric=document.getElementById("pilotMetric").value,share=document.getElementById("pilotShare").value;if(!state||!controls||!duration||!metric||!share){toast("Complete the pilot configuration");return}if(controls.split(" + ").includes(state)){toast("Pilot and control regions must be different");return}c.pilot={state,controls,duration,metric,share,ran:true};go("optimizer");toast("Regional pilot completed in demo")}
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove("show"),2100)}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest(".nav-item");if(b)go(b.dataset.page)});go("overview");
</script>
</body>
