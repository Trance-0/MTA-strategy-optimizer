name: Mirror GitHub to Gitea

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  delete:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: mirror-to-gitea
  cancel-in-progress: false

env:
  # The one branch on the destination that is deliberately not a copy of a
  # GitHub branch. The mirror job exempts it from pruning and from reference
  # verification; the snapshot job is the only writer.
  SNAPSHOT_BRANCH: gitea-snapshot

jobs:
  mirror:
    if: github.event_name != 'delete' || github.event.ref_type == 'branch' || github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.configuration.outputs.ready }}
      base_url: ${{ steps.configuration.outputs.base_url }}
      repository_path: ${{ steps.configuration.outputs.repository_path }}
    steps:
      - name: Check mirror configuration
        id: configuration
        shell: bash
        env:
          GITEA_USERNAME: ${{ secrets.GITEA_USERNAME }}
          GITEA_PASSWORD: ${{ secrets.GITEA_PASSWORD }}
          GITEA_REPOSITORY: ${{ secrets.GITEA_REPOSITORY }}
        run: |
          set -euo pipefail
          if test -z "$GITEA_USERNAME" || test -z "$GITEA_PASSWORD" || test -z "$GITEA_REPOSITORY"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gitea mirror is not configured. Add GITEA_USERNAME, GITEA_PASSWORD, and GITEA_REPOSITORY as repository secrets, then run this workflow manually."
            exit 0
          fi
          case "$GITEA_REPOSITORY" in
            https://*)
              repository_target="${GITEA_REPOSITORY#https://}"
              case "$repository_target" in
                */*)
                  repository_host="${repository_target%%/*}"
                  repository_path="${repository_target#*/}"
                  ;;
                *)
                  echo "GITEA_REPOSITORY must include a host, owner, and repository."
                  exit 1
                  ;;
              esac
              case "$repository_host" in
                ""|*@*|*[!A-Za-z0-9.:-]*)
                  echo "GITEA_REPOSITORY contains an invalid HTTPS host."
                  exit 1
                  ;;
              esac
              gitea_base_url="https://${repository_host}"
              ;;
            http://*|*://*|*@*)
              echo "GITEA_REPOSITORY must be an HTTPS Gitea URL or owner/repository.git without credentials."
              exit 1
              ;;
            *)
              gitea_base_url="https://gitea.com"
              repository_path="$GITEA_REPOSITORY"
              ;;
          esac
          repository_path="${repository_path%/}"
          repository_path="${repository_path%.git}"
          IFS=/ read -r repository_owner repository_name extra_path <<EOF
          $repository_path
          EOF
          if test -z "$repository_owner" || test -z "$repository_name" || test -n "${extra_path:-}"; then
            echo "GITEA_REPOSITORY must identify exactly one owner and repository."
            exit 1
          fi
          case "$repository_path" in
            *[!A-Za-z0-9._/-]*)
              echo "GITEA_REPOSITORY contains unsupported characters."
              exit 1
              ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "base_url=$gitea_base_url" >> "$GITHUB_OUTPUT"
          echo "repository_path=$repository_path" >> "$GITHUB_OUTPUT"

      - name: Mirror branches and tags
        if: steps.configuration.outputs.ready == 'true'
        shell: bash
        env:
          GITEA_USERNAME: ${{ secrets.GITEA_USERNAME }}
          GITEA_PASSWORD: ${{ secrets.GITEA_PASSWORD }}
          GITEA_BASE_URL: ${{ steps.configuration.outputs.base_url }}
          GITEA_REPOSITORY_PATH: ${{ steps.configuration.outputs.repository_path }}
        run: |
          set -euo pipefail

          progress() {
            local percent="$1"
            local label="$2"
            local width=20
            local filled=$((percent * width / 100))
            local empty=$((width - filled))
            local filled_bar empty_bar
            printf -v filled_bar '%*s' "$filled" ''
            printf -v empty_bar '%*s' "$empty" ''
            filled_bar="${filled_bar// /#}"
            empty_bar="${empty_bar// /-}"
            printf '[%s%s] %3d%% %s\n' "$filled_bar" "$empty_bar" "$percent" "$label"
            printf '| `%3d%%` | %s |\n' "$percent" "$label" >> "$GITHUB_STEP_SUMMARY"
          }

          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### GitHub-to-Gitea mirror

          GitHub is the source of truth. Gitea branches and tags are force-updated to the GitHub refs. Gitea's protected `master` branch is retained as an exact alias of GitHub `main` when GitHub has no `master` branch.

          | Progress | Status |
          | ---: | --- |
          EOF

          progress 5 "Preparing credential helper"

          askpass="$RUNNER_TEMP/gitea-askpass.sh"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in' \
            '  *Username*) printf '\''%s\n'\'' "$GITEA_USERNAME" ;;' \
            '  *Password*) printf '\''%s\n'\'' "$GITEA_PASSWORD" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"

          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          progress 15 "Cloning the authoritative GitHub repository"
          git clone --bare --filter=blob:none "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" source.git
          progress 30 "Refreshing every GitHub branch and tag"
          git -C source.git fetch origin "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*" --prune --force
          git -C source.git remote add gitea "${GITEA_BASE_URL}/${GITEA_REPOSITORY_PATH}.git"

          progress 45 "Force-updating Gitea branches from GitHub"
          while IFS= read -r branch; do
            git -C source.git push gitea --force "refs/heads/${branch}:refs/heads/${branch}"
          done < <(git -C source.git for-each-ref --format='%(refname:strip=2)' refs/heads)

          if git -C source.git show-ref --verify --quiet refs/heads/main &&
             ! git -C source.git show-ref --verify --quiet refs/heads/master; then
            progress 55 "Aligning protected Gitea master with GitHub main"
            git -C source.git push gitea --force "refs/heads/main:refs/heads/master"
          fi

          progress 65 "Pruning Gitea-only branches except protected master"
          while IFS= read -r remote_ref; do
            branch="${remote_ref#refs/heads/}"
            if test "$branch" = "master" || test "$branch" = "$SNAPSHOT_BRANCH"; then
              continue
            fi
            if ! git -C source.git show-ref --verify --quiet "refs/heads/${branch}"; then
              git -C source.git push gitea --delete "$branch"
            fi
          done < <(git -C source.git ls-remote --refs --heads gitea | awk '{print $2}')

          progress 75 "Force-updating and pruning Gitea tags"
          git -C source.git push gitea --force --prune "refs/tags/*:refs/tags/*"

          progress 85 "Verifying branch and tag refs"
          expected_refs="$RUNNER_TEMP/expected-refs.txt"
          actual_refs="$RUNNER_TEMP/actual-refs.txt"
          git -C source.git for-each-ref --format='%(objectname) refs/heads/%(refname:strip=2)' refs/heads > "$expected_refs"
          if git -C source.git show-ref --verify --quiet refs/heads/main &&
             ! git -C source.git show-ref --verify --quiet refs/heads/master; then
            printf '%s refs/heads/master\n' "$(git -C source.git rev-parse refs/heads/main)" >> "$expected_refs"
          fi
          git -C source.git for-each-ref --format='%(objectname) refs/tags/%(refname:strip=2)' refs/tags >> "$expected_refs"
          # The snapshot branch carries materialized submodule files, so its
          # commit is deliberately not a GitHub commit. Excluding it keeps this
          # an exact-match check for everything the mirror actually owns.
          git -C source.git ls-remote --refs gitea 'refs/heads/*' 'refs/tags/*' |
            awk -v snapshot="refs/heads/$SNAPSHOT_BRANCH" '$2 != snapshot {print $1 " " $2}' > "$actual_refs"
          sort -o "$expected_refs" "$expected_refs"
          sort -o "$actual_refs" "$actual_refs"
          if ! diff --unified=3 "$expected_refs" "$actual_refs"; then
            echo "Gitea refs do not exactly match the authoritative GitHub refs."
            exit 1
          fi

          progress 100 "Sync complete; Gitea refs match GitHub"

          rm -f "$askpass"

  # Gitea cannot reach github.com, so a mirrored gitlink there resolves to
  # nothing: the destination receives the recorded submodule commit identifier
  # and no way to fetch its content. This job publishes one extra branch whose
  # tree has the submodule files materialized as ordinary tracked files, so a
  # Gitea checkout is self-contained without vendoring anything into GitHub.
  #
  # GitHub stays authoritative. Nothing is copied by hand: bumping a submodule
  # pin here regenerates this branch on the next run.
  snapshot:
    needs: mirror
    if: needs.mirror.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      # Deliberately without `submodules`. The next step initializes them by
      # recorded commit instead, because `actions/checkout` fetches the branch
      # named in `.gitmodules` and one pin is currently reachable only from a
      # different branch. It also avoids `recursive`: `campaign-optimizer`
      # declares this repository as its own submodule, so recursion re-enters
      # the project and pulls a stale copy of itself.
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize submodules one level deep
        shell: bash
        run: |
          set -euo pipefail
          # One level only. There is no `--no-recursive` flag to write here:
          # one level is already the default, and adding `--recursive` is what
          # would opt into the cycle above. This line stays as it is.
          git submodule update --init
          git submodule status

      - name: Publish the materialized snapshot branch
        shell: bash
        env:
          GITEA_USERNAME: ${{ secrets.GITEA_USERNAME }}
          GITEA_PASSWORD: ${{ secrets.GITEA_PASSWORD }}
          GITEA_BASE_URL: ${{ needs.mirror.outputs.base_url }}
          GITEA_REPOSITORY_PATH: ${{ needs.mirror.outputs.repository_path }}
        run: |
          set -euo pipefail

          askpass="$RUNNER_TEMP/gitea-askpass.sh"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in' \
            '  *Username*) printf '\''%s\n'\'' "$GITEA_USERNAME" ;;' \
            '  *Password*) printf '\''%s\n'\'' "$GITEA_PASSWORD" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          # Record what was pinned before the gitlinks are replaced, so the
          # snapshot commit message states the exact provenance of its files.
          pinned="$(git submodule status --cached | awk '{print "  " $2 " " $1}')"

          # A submodule working tree carries its own `.git` -- a file pointing
          # into `.git/modules/`. Removing it demotes the directory to ordinary
          # files that the superproject can track.
          while IFS= read -r submodule_path; do
            rm -rf "${submodule_path:?}/.git"
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')

          git rm --cached --quiet --ignore-unmatch -r -- external
          rm -f .gitmodules

          # Each vendored project keeps its own ignore files, and they are
          # written for a standalone checkout rather than for this tree, so
          # `--force` is what makes the snapshot complete rather than partial.
          git add --force --all -- external
          git add --all -- .gitmodules

          git -c user.name='Gitea mirror' \
              -c user.email='mirror@users.noreply.github.com' \
              commit --quiet --allow-empty -m "$(printf 'snapshot: materialize submodules at %s\n\nGenerated by .github/workflows/mirror-to-gitea.yml. Do not commit here;\nthis branch is force-updated from GitHub %s.\n\nPinned submodule commits:\n%s\n' "${GITHUB_SHA:0:12}" "$GITHUB_REF_NAME" "$pinned")"

          # Refuse to publish a snapshot that would not actually help Gitea.
          if test -z "$(git ls-files -- external)"; then
            echo "The snapshot tree records no files below external/."
            exit 1
          fi
          if git ls-files --stage -- external | grep -q '^160000'; then
            echo "The snapshot tree still records a gitlink below external/."
            exit 1
          fi

          git remote add gitea "${GITEA_BASE_URL}/${GITEA_REPOSITORY_PATH}.git"
          git push gitea --force "HEAD:refs/heads/${SNAPSHOT_BRANCH}"

          printf '### Gitea submodule snapshot\n\nForce-updated `%s` on Gitea with %s tracked files below `external/`, materialized from GitHub `%s`.\n' \
            "$SNAPSHOT_BRANCH" "$(git ls-files -- external | wc -l)" "${GITHUB_SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"

          rm -f "$askpass"
