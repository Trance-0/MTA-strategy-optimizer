name: Mirror GitHub to Gitea

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  delete:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: mirror-to-gitea
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event_name != 'delete' || github.event.ref_type == 'branch' || github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check mirror configuration
        id: configuration
        shell: bash
        env:
          GITEA_USERNAME: ${{ secrets.GITEA_USERNAME }}
          GITEA_PASSWORD: ${{ secrets.GITEA_PASSWORD }}
          GITEA_REPOSITORY: ${{ secrets.GITEA_REPOSITORY }}
        run: |
          set -euo pipefail
          if test -z "$GITEA_USERNAME" || test -z "$GITEA_PASSWORD" || test -z "$GITEA_REPOSITORY"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gitea mirror is not configured. Add GITEA_USERNAME, GITEA_PASSWORD, and GITEA_REPOSITORY as repository secrets, then run this workflow manually."
            exit 0
          fi
          case "$GITEA_REPOSITORY" in
            https://*)
              repository_target="${GITEA_REPOSITORY#https://}"
              case "$repository_target" in
                */*)
                  repository_host="${repository_target%%/*}"
                  repository_path="${repository_target#*/}"
                  ;;
                *)
                  echo "GITEA_REPOSITORY must include a host, owner, and repository."
                  exit 1
                  ;;
              esac
              case "$repository_host" in
                ""|*@*|*[!A-Za-z0-9.:-]*)
                  echo "GITEA_REPOSITORY contains an invalid HTTPS host."
                  exit 1
                  ;;
              esac
              gitea_base_url="https://${repository_host}"
              ;;
            http://*|*://*|*@*)
              echo "GITEA_REPOSITORY must be an HTTPS Gitea URL or owner/repository.git without credentials."
              exit 1
              ;;
            *)
              gitea_base_url="https://gitea.com"
              repository_path="$GITEA_REPOSITORY"
              ;;
          esac
          repository_path="${repository_path%/}"
          repository_path="${repository_path%.git}"
          IFS=/ read -r repository_owner repository_name extra_path <<EOF
          $repository_path
          EOF
          if test -z "$repository_owner" || test -z "$repository_name" || test -n "${extra_path:-}"; then
            echo "GITEA_REPOSITORY must identify exactly one owner and repository."
            exit 1
          fi
          case "$repository_path" in
            *[!A-Za-z0-9._/-]*)
              echo "GITEA_REPOSITORY contains unsupported characters."
              exit 1
              ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "base_url=$gitea_base_url" >> "$GITHUB_OUTPUT"
          echo "repository_path=$repository_path" >> "$GITHUB_OUTPUT"

      - name: Prepare and atomically publish the complete mirror
        if: steps.configuration.outputs.ready == 'true'
        shell: bash
        env:
          GITEA_USERNAME: ${{ secrets.GITEA_USERNAME }}
          GITEA_PASSWORD: ${{ secrets.GITEA_PASSWORD }}
          GITEA_BASE_URL: ${{ steps.configuration.outputs.base_url }}
          GITEA_REPOSITORY_PATH: ${{ steps.configuration.outputs.repository_path }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cat > "$work/askpass" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GITEA_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEA_PASSWORD" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$work/askpass"
          export GIT_ASKPASS="$work/askpass" GIT_TERMINAL_PROMPT=0
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git clone --bare --no-local "$source_url" "$work/source.git"
          default_branch=$(git -C "$work/source.git" symbolic-ref --short HEAD)
          parent=$(git -C "$work/source.git" rev-parse "refs/heads/$default_branch")
          git clone --no-local --no-checkout "$work/source.git" "$work/snapshot"
          cd "$work/snapshot"
          git remote set-url origin "$source_url"
          git -c submodule.recurse=false checkout --detach "$parent"
          git ls-tree -r HEAD | awk '$1 == "160000" {print $4 " " $3}' > "$work/pins"
          test -s "$work/pins"
          git -c submodule.recurse=false submodule update --init
          while read -r path pin; do
            test "$(git -C "$path" rev-parse HEAD)" = "$pin"
            git -c submodule.recurse=false fetch --no-tags "$PWD/$path" "$pin"
            git rm --cached --quiet -- "$path"
            git read-tree --prefix="$path/" "$pin"
            rm -f "$path/.git"
          done < "$work/pins"
          git ls-files --stage | awk '$1 == "160000" {print $4}' > "$work/nested-links"
          while IFS= read -r path; do
            git update-index --force-remove -- "$path"
          done < "$work/nested-links"
          git rm --quiet -- .gitmodules
          export GIT_AUTHOR_NAME='Gitea mirror' GIT_COMMITTER_NAME='Gitea mirror'
          export GIT_AUTHOR_EMAIL='mirror@users.noreply.github.com'
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          GIT_AUTHOR_DATE=$(git show -s --format=%cI "$parent")
          export GIT_AUTHOR_DATE GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          {
            printf 'snapshot: materialize submodules at %.12s\n\n' "$parent"
            printf 'Generated by .github/workflows/mirror-to-gitea.yml.\n'
            printf 'GitHub is authoritative: %s is its %s. Edit GitHub only.\n\n' "$parent" "$default_branch"
            printf 'Pinned submodule commits:\n'
            sed 's/^/  /' "$work/pins"
          } > "$work/message"
          git -c commit.gpgsign=false commit --quiet -F "$work/message"
          test "$(git rev-parse HEAD^)" = "$parent"
          tree=$(git ls-tree -r HEAD)
          if printf '%s\n' "$tree" | grep -q '^160000 '; then
            echo 'Snapshot still contains a Git link' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          root = Path('external/mta_sim_dataset/ZheyuanWu')
          required = [root / name for name in (
              'simulations/__init__.py', 'simulations/baseline/mta_dataset/__init__.py',
              'simulations/baseline/mta_dataset/configuration.py', 'examples/baseline.toy.json')]
          if not all(path.is_file() for path in required):
              raise SystemExit('Snapshot is missing required generator inputs')
          subprocess.run(['git', 'ls-files', '--error-unmatch', '--', *map(str, required)], check=True)
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--', str(root)], check=True)
          if not isinstance(json.loads(required[-1].read_text(encoding='utf-8')), dict):
              raise SystemExit('Toy configuration must be a JSON object')
          PY
          snapshot=$(git rev-parse HEAD)
          git -C "$work/source.git" -c submodule.recurse=false fetch --no-tags "$PWD" HEAD
          cd "$work/source.git"
          # Gitea receives the default branch and nothing else. Development
          # branches are GitHub's; publishing them would expose unreviewed work
          # and let a webhook deploy from a branch that was never validated.
          # Delete every other local reference so the mirror cannot carry one,
          # and so --prune removes any that an earlier run already published.
          # Read the reference list fully before deleting, and delete in one
          # transaction, rather than editing the store while walking it.
          git for-each-ref --format='delete %(refname)' refs/heads refs/tags > "$work/prune-local"
          git update-ref --stdin < "$work/prune-local"
          git update-ref "refs/heads/$default_branch" "$snapshot"
          # Gitea's default branch is main; keep the master alias pointing at the
          # same snapshot when GitHub has no master of its own.
          if test "$default_branch" = main; then
            git update-ref refs/heads/master "$snapshot"
          fi
          git remote add gitea "$GITEA_BASE_URL/$GITEA_REPOSITORY_PATH.git"
          # The Gitea host answers through a reverse proxy that intermittently
          # returns 502 before the request reaches Gitea. That aborts reference
          # discovery with exit 128 and publishes nothing, so the whole mirror
          # fails on a fault that has nothing to do with this repository. Retry
          # only a transport fault, and only a bounded number of times. Gitea's
          # own answers, including a rejected reference, must still fail at once.
          gateway_retry() {
            local attempt=1
            while true; do
              if "$@" > "$work/attempt-out" 2> "$work/attempt-err"; then
                cat "$work/attempt-out"
                cat "$work/attempt-err" >&2
                return 0
              fi
              if ! grep -qE 'The requested URL returned error: (429|50[0-9])|Could not resolve host|Connection (timed out|reset)|Empty reply from server|unexpected disconnect' "$work/attempt-err"; then
                cat "$work/attempt-out"
                cat "$work/attempt-err" >&2
                return 1
              fi
              if test "$attempt" -ge 5; then
                cat "$work/attempt-err" >&2
                echo 'Gitea gateway still failing after 5 attempts' >&2
                return 1
              fi
              echo "Gitea gateway fault on attempt $attempt; retrying" >&2
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }
          # --atomic makes each attempt apply every reference or none, so a retry
          # resumes from the old state and can never publish a partial mirror.
          # --prune deletes destination branches and tags absent here, which is
          # what removes any development branch a previous run published.
          gateway_retry git push --atomic --force --prune gitea \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
          git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags | sort > "$work/expected"
          gateway_retry git ls-remote --refs gitea 'refs/heads/*' 'refs/tags/*' \
            | awk '{print $1 " " $2}' | sort > "$work/actual"
          # The comparison is exact in both directions, so a destination branch
          # that is not the default branch or its master alias fails the job.
          diff -u "$work/expected" "$work/actual"
          printf 'Gitea mirror verified: %s snapshot %s, no other reference\n' "$default_branch" "$snapshot"
