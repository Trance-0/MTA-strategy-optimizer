name: Verify specifications and product
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Initialize pinned generator only
        run: |
          git submodule sync -- external/mta_sim_dataset
          git -c submodule.recurse=false submodule update --init -- external/mta_sim_dataset
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.2"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            docs/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra backend --extra strategy-evaluation
          npm --prefix dashboard ci
          npm --prefix docs ci
      - name: Check pinned deployment inputs
        run: |
          pin=$(git rev-parse HEAD:external/mta_sim_dataset)
          test "$(git -C external/mta_sim_dataset rev-parse HEAD)" = "$pin"
          git -C external/mta_sim_dataset diff --exit-code HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('external/mta_sim_dataset/ZheyuanWu')
          for name in ('simulations/__init__.py', 'simulations/baseline/mta_dataset/__init__.py',
                       'simulations/baseline/mta_dataset/configuration.py', 'examples/baseline.toy.json'):
              if not (root / name).is_file():
                  raise SystemExit(f'Missing generator input: {name}')
          if not isinstance(json.loads((root / 'examples/baseline.toy.json').read_text(encoding='utf-8')), dict):
              raise SystemExit('Toy configuration must be a JSON object')
          PY
      - name: Test product contracts
        run: |
          for suite in modules/mta_common modules/mta_attribution modules/mta_standard modules/mta_strategy_recommendation modules/mta_strategy_evaluation backend; do
            .venv/bin/python -X utf8 -B -m unittest discover -s "$suite/tests" -t . -p 'test_*.py'
          done
          npm --prefix dashboard test
      - name: Build live and static clients and documentation
        env:
          DOCS_BASE_PATH: /MTA-strategy-optimizer/docs/
        run: |
          npm --prefix dashboard run build
          npm --prefix dashboard run build:static
          npm --prefix docs run build
          node docs/.vitepress/build_pages_site.mjs
