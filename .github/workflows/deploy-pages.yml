name: Deploy dashboard and documentation to GitHub Pages

# Publishes two things from one artifact:
#
#   /       the Vue dashboard, built for a static host
#   /docs/  the VitePress documentation site
#
# Pages serves static files and cannot run the dashboard's Flask API, so the
# published client is built in static mode and reads a snapshot exported from
# the committed artifacts at build time. It is the same client source the local
# run serves. The documentation is built with its base path pointing at the
# `/docs/` subdirectory, because Pages performs no rewrites.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      # Vite's engine range is `^20.19.0 || >=22.12.0`, and its bundler binding
      # is an optional dependency carrying that same range: on an unsupported
      # version npm skips the binding silently, `npm ci` still succeeds, and
      # the build fails afterwards with a missing-module error naming neither
      # Node nor the version. `22` resolves to the latest 22.x, which satisfies
      # the range; the lower bound is what must not be crossed.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.2"

      - name: Install backend dependencies
        run: uv sync --frozen --extra backend

      - name: Install documentation dependencies
        working-directory: docs
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      # The snapshot is exported from the committed CSV and JSON artifacts, not
      # from a database: a static host has no socket to reach PostgreSQL with,
      # and a snapshot exported from one would bake a private deployment's data
      # into a public artifact. `export_dashboard_snapshot.py` pins file mode
      # and refuses to write anything read from a database.
      - name: Build the dashboard for a static host
        working-directory: dashboard
        run: npm run build:static

      # The documentation moves one level down, so its base path is the Pages
      # base path plus `docs`. Every internal link and asset URL is resolved
      # against this at build time. `base_path` is `/` for a user site and
      # `/<repo>` for a project site, with no guarantee about a trailing slash,
      # so the two are joined here rather than concatenated: `config.mts`
      # appends the trailing slash VitePress requires.
      - name: Build VitePress site
        working-directory: docs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          DOCS_BASE_PATH="$(printf '%s' "$PAGES_BASE_PATH" | sed 's:/*$::')/docs/"
          echo "Building the documentation with base ${DOCS_BASE_PATH}"
          DOCS_BASE_PATH="$DOCS_BASE_PATH" npm run build

      - name: Assemble the Pages site
        run: node script/build_pages_site.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
