<!doctype html>
<!--
  The published dashboard.

  GitHub Pages serves static files and cannot run a Streamlit server, so this
  page boots the very same `dashboard/` Python in the visitor's browser through
  stlite, which runs Streamlit on Pyodide (CPython compiled to WebAssembly).
  No code is forked for the web: `script/build_pages_site.mjs` copies the same
  modules the local `streamlit run` uses.

  Two consequences follow from running in a browser tab and are handled here
  rather than hidden:

  - WebAssembly has no raw TCP socket, so `DATABASE=true` cannot reach
    PostgreSQL from this page at all. `DASHBOARD_HOSTED` is exported below, and
    the settings module reads it to present the data-source tab as unavailable
    instead of offering credential fields that could never connect.
  - The first load compiles the Python runtime, so it takes appreciably longer
    than a local start. The splash below states that plainly and is removed
    once Streamlit paints.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI-MTA Dashboard | Marketing ROI Analysis</title>
    <meta
      name="description"
      content="Multi-Touch Attribution evidence and Ad Group budget strategy, running in the browser."
    />
    <link rel="stylesheet" href="./stlite/stlite.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f5f6f8;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #root {
        height: 100%;
      }

      /* The splash covers the blank page while Pyodide downloads and starts.
         It is removed on the first Streamlit paint, not on a timer, so it can
         never hide a running app or clear before one exists. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0d2547;
        color: #e8edf7;
        text-align: center;
        padding: 24px;
        transition: opacity 0.4s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .logo {
        width: 46px;
        height: 46px;
        border: 2px solid #fff;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 1.1rem;
      }
      #boot h1 {
        font-size: 1.05rem;
        font-weight: 650;
        margin: 0;
        letter-spacing: 0.3px;
      }
      #boot p {
        font-size: 0.82rem;
        color: #bac6df;
        margin: 0;
        max-width: 30rem;
        line-height: 1.5;
      }
      #boot .bar {
        width: 190px;
        height: 3px;
        border-radius: 999px;
        background: #ffffff24;
        overflow: hidden;
      }
      #boot .bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: #4d86e0;
        border-radius: 999px;
        animation: slide 1.25s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      #boot .links {
        display: flex;
        gap: 18px;
        font-size: 0.78rem;
      }
      #boot .links a {
        color: #9db7e8;
        text-decoration: none;
        border-bottom: 1px solid #ffffff24;
        padding-bottom: 2px;
      }
      #boot .links a:hover {
        color: #fff;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar span {
          animation: none;
          width: 100%;
        }
        #boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="logo">M</div>
      <h1>AI-MTA &middot; Marketing ROI Analysis</h1>
      <div class="bar"><span></span></div>
      <p>
        Starting Python in your browser. The first load downloads the runtime and
        takes around half a minute; afterwards it is cached. This published copy
        reads the repository's committed sample files.
      </p>
      <div class="links">
        <a href="./docs/">Documentation</a>
        <a href="https://github.com/Trance-0/MTA-strategy-optimizer">Repository</a>
      </div>
    </div>
    <div id="root"></div>

    <script type="module">
      import { mount } from "./stlite/stlite.js";

      // Every Python file the app imports in file mode. `models.py` is absent
      // on purpose: it declares the PostgreSQL schema, which this build cannot
      // reach, and nothing imports it when reading files.
      const PYTHON_FILES = [
        "dashboard/__init__.py",
        "dashboard/app.py",
        "dashboard/config.py",
        "dashboard/data_source.py",
        "dashboard/settings.py",
        "dashboard/theme.py",
        "dashboard/views/__init__.py",
        "dashboard/views/budget_manager.py",
        "dashboard/views/campaign_optimizer.py",
        "dashboard/views/campaigns.py",
        "dashboard/views/command_center.py",
        "dashboard/views/common.py",
        "dashboard/views/knowledge_base.py",
        "dashboard/views/optimization_log.py",
      ];

      // The artifacts the file-mode loaders actually open, mounted at the same
      // repository-relative paths `dashboard/config.py` resolves, so no path in
      // the Python changes for the web build. The 2.8 MB synthetic-events
      // extract is deliberately not here: no view reads it.
      const DATA_FILES = [
        "modules/mta_attribution/data/simulated/amazon_ads_report_sample.csv",
        "modules/mta_attribution/data/simulated/amc_mta_path_report_raw_sample.csv",
        "modules/mta_attribution/data/simulated/amc_touchpoint_entity_aggregate_sample.csv",
        "modules/mta_attribution/outputs/attribution/amc_markov_attribution_results.csv",
        "modules/mta_attribution/outputs/attribution/amc_shapley_attribution_results.csv",
        "modules/mta_attribution/outputs/attribution/amc_mta_model_comparison_touchpoints.csv",
        "modules/mta_attribution/outputs/attribution/amc_mta_model_comparison_summary.csv",
        "modules/mta_attribution/outputs/attribution/amc_mta_recommended_attribution.csv",
        "modules/mta_strategy_recommendation/data/simulated/strategy_request.json",
        "modules/mta_strategy_recommendation/data/simulated/candidate_pool.json",
        "modules/mta_strategy_recommendation/outputs/initial_budget_recommendation.json",
      ];

      const files = {};
      for (const path of [...PYTHON_FILES, ...DATA_FILES]) {
        files[path] = { url: `./${path}` };
      }

      mount(
        {
          entrypoint: "dashboard/app.py",
          files,
          // pandas ships with the Streamlit wheel stlite bundles. These two are
          // pure-Python wheels micropip installs at start. `psycopg` is absent
          // because it is a C extension with no WebAssembly build, and nothing
          // in file mode imports it.
          requirements: ["plotly", "python-dotenv"],
          // Read by `dashboard/config.py`. `DATABASE` is pinned rather than
          // merely defaulted, so a stale `.env` in the virtual filesystem can
          // never flip this build into a mode it cannot serve.
          env: {
            DATABASE: "false",
            DASHBOARD_HOSTED: "true",
          },
          // Mirrors `.streamlit/config.toml`, which is not read here: the theme
          // is pinned because Streamlit otherwise follows the visitor's OS
          // setting, and the surfaces this dashboard paints are light.
          streamlitConfig: {
            "theme.base": "light",
            "theme.primaryColor": "#2456a6",
            "theme.backgroundColor": "#f5f6f8",
            "theme.secondaryBackgroundColor": "#ffffff",
            "theme.textColor": "#161a22",
            "theme.font": "sans serif",
            "client.toolbarMode": "minimal",
          },
        },
        document.getElementById("root"),
      );

      // Wait for Streamlit's own first paint rather than for a fixed delay, so
      // a slow runtime is never revealed as an empty page.
      const boot = document.getElementById("boot");
      const observer = new MutationObserver(() => {
        if (document.querySelector('[data-testid="stAppViewContainer"]')) {
          observer.disconnect();
          boot.classList.add("done");
          setTimeout(() => boot.remove(), 500);
        }
      });
      observer.observe(document.getElementById("root"), {
        childList: true,
        subtree: true,
      });
    </script>
  </body>
</html>
