# NGINX in front of the built Vue client, forwarding the API to the service.
#
# The client fetches `/api/...` as a same-origin path, so the two containers
# must look like one origin to the browser. `marketing-roi-analysis-api` is the
# Compose service name, resolved on Docker's user-defined network.
#
# The name is resolved once at worker start, so a missing service is a startup
# failure rather than a 502 per request. `depends_on: service_healthy` in
# `compose.yaml` is what makes that ordering hold.

upstream marketing_roi_analysis_api {
    server marketing-roi-analysis-api:8501;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A pipeline stage started from Budget Manager runs for minutes while the
    # client polls; the default 60s read timeout would cut a slow first
    # snapshot short and surface as a parse error naming character 0.
    location /api/ {
        proxy_pass http://marketing_roi_analysis_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # The client routes on the hash, so every non-asset path resolves to the
    # one document rather than to a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
