 {id:"shave-us",name:"Shave Care — US",budget:500,spend:374,forecast:492,roas:4.18,recRoas:4.83,controlRoas:4.31,status:"Needs optimization",review:{outcome:"CONFLICT",rule:"Protected Discovery Minimum",message:"Two ad groups fall below the required learning budget.",risk:"High"},groups:[["Brand Defense",120,155,6.1],["Generic Search",180,150,3.2],["Retargeting",90,100,4.5],["Discovery",110,95,2.6]],adopted:false,pilot:null,feedback:null},

 {id:"dsp-prospecting",name:"DSP Prospecting — US",budget:420,spend:238,forecast:361,roas:2.10,recRoas:2.56,controlRoas:2.23,status:"Review",review:{outcome:"NO_COVERAGE",rule:"No applicable prospecting rule",message:"Third-party prospecting audiences are not covered by an approved rule.",risk:"Medium"},groups:[["In-market Audiences",150,130,2.4],["Lifestyle Audiences",105,95,2.0],["Contextual",85,110,2.8],["Lookalike",80,85,2.3]],adopted:false,pilot:null,feedback:null}
];
const meta={overview:["Command Center","BrandLens / Overview"],budget:["Budget Manager","BrandLens / Planning / Budget"],campaigns:["Campaigns","BrandLens / Planning / Campaigns"],optimizer:["Campaign Optimizer","BrandLens / Planning / Optimizer"],gmv:["GMV Forecast","BrandLens / Planning / SK-II GMV NN"],log:["Optimization Log","BrandLens / Insights / Results"],knowledge:["Knowledge Base","BrandLens / Insights / Governance"]};
let currentCampaignId=null,optimizerReady=false,noteOpen=false,toastTimer,currentPage="overview",runToken=0;
const money=n=>(n<0?"−$":"$")+Math.abs(n)+"K",pct=(a,b)=>Math.round(a/b*100)+"%",selected=()=>campaigns.find(c=>c.id===currentCampaignId)||null;

function pageOverview(){return `<div class="two">

 </div>`}

  const W1=transpose(model.weights.W1),W2=transpose(model.weights.W2),W3=transpose(model.weights.W3);
  let h=reluVec(addBias(matVec(W1,x),model.weights.b1));
  h=reluVec(addBias(matVec(W2,h),model.weights.b2));
  const y=addBias(matVec(W3,h),model.weights.b3)[0];
  const rev=Math.min(Math.expm1(Math.max(y,0)),model.rev_cap);
  return {logPred:y,revenue:rev};
}
function buildGmvFeatures(inp){
  const b=[inp.budget_sp,inp.budget_sb,inp.budget_sd,inp.budget_dsp].map(v=>Math.max(0,+v||0));
  const tot=b.reduce((s,v)=>s+v,0)||1;
  const shares=b.map(v=>v/tot);
  const dow=Math.max(0,Math.min(6,+inp.dow|0));
  const dowOH=Array.from({length:7},(_,i)=>i===dow?1:0);
  const countries=GMV_MODEL.country_classes;
  const countryOH=countries.map(c=>c===inp.country?1:0);
  const st=inp.struct||{};
  const structCols=["share_cost_top_of_search","share_cost_product_page","share_cost_sb_headline","share_cost_sp_product_ad","share_cost_dsp_video","share_cost_dsp_image","share_cost_dsp_unspecified_creative","n_placement_types"];
  const struct=structCols.map(c=>+st[c]||0);
  return [
    ...b.map(v=>Math.log1p(v)),
    ...shares,
    tot>0?1:0,
    +inp.is_weekend?1:0,
    ...dowOH,
    ...countryOH,
    ...struct
  ];
}
function moneyFull(n){return "$"+Math.round(n).toLocaleString("en-US")}
function readGmvForm(){
  const d=GMV_MODEL.defaults;
  const struct={};
  for(const k of Object.keys(d.struct)){
    const el=document.getElementById("g_"+k);
    struct[k]=el?+el.value:d.struct[k];
  }
  return {
    budget_sp:+document.getElementById("g_budget_sp").value,
    budget_sb:+document.getElementById("g_budget_sb").value,
    budget_sd:+document.getElementById("g_budget_sd").value,
    budget_dsp:+document.getElementById("g_budget_dsp").value,
    is_weekend:document.getElementById("g_weekend").checked?1:0,
    dow:+document.getElementById("g_dow").value,
    country:document.getElementById("g_country").value,
    struct
  };
}
function runGmvPredict(scale=1){
  const inp=readGmvForm();
  if(scale!==1){
    inp.budget_sp*=scale;inp.budget_sb*=scale;inp.budget_sd*=scale;inp.budget_dsp*=scale;
  }
  const x=buildGmvFeatures(inp);
  if(x.length!==GMV_MODEL.n_features){toast("Feature dim mismatch");return null}
  return mlpForward(GMV_MODEL,x);
}
function refreshGmv(){
  const base=runGmvPredict(1),up=runGmvPredict(1.1);
  if(!base||!up)return;
  const m=GMV_MODEL.test_metrics;
  document.getElementById("gmvPred").textContent=moneyFull(base.revenue);
  document.getElementById("gmvWhatIf").textContent=moneyFull(up.revenue);
  document.getElementById("gmvDelta").textContent=((up.revenue-base.revenue)>=0?"+":"")+moneyFull(up.revenue-base.revenue);
  document.getElementById("gmvMeta").textContent=`MLP Extended-27 · test MAPE ${(m["MAPE_gmv>=10"]*100).toFixed(1)}% · R² ${m.R2.toFixed(2)}`;
  const tot=readGmvForm();
  const sum=tot.budget_sp+tot.budget_sb+tot.budget_sd+tot.budget_dsp;
  document.getElementById("gmvSpend").textContent=moneyFull(sum);
}
function pageGmv(){
  const d=GMV_MODEL.defaults,st=d.struct;
  const budgetFields=[["g_budget_sp","SP budget",d.budget_sp],["g_budget_sb","SB budget",d.budget_sb],["g_budget_sd","SD budget",d.budget_sd],["g_budget_dsp","DSP budget",d.budget_dsp]];
  const structFields=Object.keys(st).map(k=>[k,st[k]]);
  return `<div class="optimizer-bar"><div><strong>SK-II attributed GMV forecast</strong><span>Real MLP weights from asin-gmv-nn Extended-27 · not campaign ROAS ontology</span></div><div class="actions"><button class="btn primary" onclick="refreshGmv()">Run prediction</button></div></div>
  <div class="optimizer-grid">
   <section class="card"><div class="card-head"><h2>Inputs</h2><div class="sub">Budgets + calendar + placement/creative cost shares</div></div><div class="card-body">
    <div class="pilot-form" style="grid-template-columns:repeat(2,1fr)">
     ${budgetFields.map(f=>`<div class="field"><label>${f[1]}</label><input id="${f[0]}" type="number" min="0" step="10" value="${f[2].toFixed(0)}" oninput="refreshGmv()"></div>`).join("")}
     <div class="field"><label>Marketplace</label><select id="g_country" onchange="refreshGmv()">${GMV_MODEL.country_classes.map(c=>`<option ${c===d.country?"selected":""}>${c}</option>`).join("")}</select></div>
     <div class="field"><label>Day of week</label><select id="g_dow" onchange="refreshGmv()">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((n,i)=>`<option value="${i}" ${i===d.dow?"selected":""}>${n}</option>`).join("")}</select></div>
     <div class="field"><label>Weekend</label><select id="g_weekend_sel" onchange="document.getElementById('g_weekend').checked=this.value==='1';refreshGmv()"><option value="0">No</option><option value="1">Yes</option></select><input id="g_weekend" type="checkbox" style="display:none"></div>
    </div>
    <div class="pacing-title"><h3>P0 structure shares</h3><span>From cost mix · editable</span></div>
    <div class="pilot-form" style="grid-template-columns:repeat(2,1fr)">
     ${structFields.map(([k,v])=>`<div class="field"><label>${k.replace(/^share_cost_/,"").replace(/_/g," ")}</label><input id="g_${k}" type="number" min="0" max="${k==="n_placement_types"?10:1}" step="${k==="n_placement_types"?0.1:0.01}" value="${(+v).toFixed(k==="n_placement_types"?1:3)}" oninput="refreshGmv()"></div>`).join("")}
    </div>
   </div></section>
   <aside class="card recommendation"><div class="card-head"><h2>Prediction</h2><div class="right">${tag("Live NN","blue")}</div></div><div class="card-body">
    <div class="result" style="max-width:none;grid-template-columns:1fr"><div><small>Predicted attributed revenue</small><b id="gmvPred">—</b></div></div>
    <div class="impact" style="margin:0 -15px -15px">
     <div><b id="gmvSpend">—</b><span>Total daily budget</span></div>
     <div><b id="gmvWhatIf">—</b><span>If all budgets +10%</span></div>
     <div><b id="gmvDelta" class="up">—</b><span>Δ revenue</span></div>
    </div>
    <p style="margin:14px 0 0;font-size:11px;color:var(--muted)" id="gmvMeta"></p>
    <p style="margin:8px 0 0;font-size:11px;color:var(--muted)">Label = Amazon attributed sales (not organic GMV). Demo uses exported MLP; Multitask available in training code.</p>
   </aside>
  </div>`;
}

const pages={overview:pageOverview,budget:pageBudget,campaigns:pageCampaigns,optimizer:pageOptimizer,gmv:pageGmv,log:pageLog,knowledge:pageKnowledge};
function go(p){currentPage=p;document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.page===p));document.getElementById("pageTitle").textContent=meta[p][0];document.getElementById("pageCrumb").textContent=meta[p][1];document.getElementById("content").innerHTML=pages[p]();window.scrollTo(0,0);if(p==="gmv")setTimeout(refreshGmv,0)}
function openOptimizer(id){runToken++;currentCampaignId=id;optimizerReady=false;noteOpen=false;go("optimizer")}function clearCampaign(){runToken++;currentCampaignId=null;optimizerReady=false;noteOpen=false;go("optimizer")}
function runOptimizer(){const b=document.getElementById("runBtn"),token=++runToken,id=currentCampaignId;if(b){b.disabled=true;b.textContent="Analyzing…"}setTimeout(()=>{if(token!==runToken||id!==currentCampaignId)return;optimizerReady=true;if(currentPage==="optimizer")go("optimizer");toast("Recommendation ready")},450)}
function adopt(){const c=selected();if(!c){toast("Choose a campaign before adoption");return}c.adopted=true;optimizerReady=true;go("optimizer");toast("Recommendation adopted")}
function toggleNote(){noteOpen=!noteOpen;document.getElementById("feedbackNote")?.classList.toggle("show",noteOpen)}
function submitFeedback(action){const c=active(),note=document.getElementById("feedbackText")?.value.trim()||"";c.feedback={action,note};go("optimizer");toast("Feedback recorded for ontology review")}
function startPilot(){const c=selected();if(!c){toast("Select a campaign before starting a regional pilot");return}const state=document.getElementById("pilotState").value,controls=document.getElementById("pilotControls").value,duration=document.getElementById("pilotDuration").value,metric=document.getElementById("pilotMetric").value,share=document.getElementById("pilotShare").value;if(!state||!controls||!duration||!metric||!share){toast("Complete the pilot configuration");return}if(controls.split(" + ").includes(state)){toast("Pilot and control regions must be different");return}c.pilot={state,controls,duration,metric,share,ran:true};go("optimizer");toast("Regional pilot completed in demo")}
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove("show"),2100)}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest(".nav-item");if(b)go(b.dataset.page)});go("overview");
</script>
